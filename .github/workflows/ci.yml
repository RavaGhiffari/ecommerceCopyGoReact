# CI (Phase 7b, PLAN.md §7.1).
#
#   backend   go vet, gofmt, sqlc diff, migrations up → down → up, unit and
#             integration tests against a Postgres service container
#             + OpenAPI lint of backend/api/openapi.yaml
#   frontend  npm ci, lint, Vitest, build (tsc -b also type-checks e2e/)
#   images    production images build (docker-compose.prod.yml) + nginx -t
#   e2e       the Compose "e2e" stack + Playwright (Chromium); only on main
#             and on a manual run, because it takes several minutes
#
# Tool versions match the Makefile (sqlc, migrate) and go.mod (Go).

name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLC_IMAGE: sqlc/sqlc:1.29.0
  MIGRATE_IMAGE: migrate/migrate:v4.18.3
  REDOCLY_IMAGE: redocly/cli:2.14.0

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18.7-trixie
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: marketplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The integration tests refuse any database whose name does not end in _test.
      TEST_DATABASE_URL: postgres://marketplace:ci-only-password@localhost:5432/marketplace_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted (run make fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./... && go vet -tags=integration ./...

      # Valid OpenAPI 3.1 (Redocly's recommended rules; warnings do not fail).
      # router/openapi_test.go separately checks that it covers every route.
      - name: OpenAPI lint
        run: docker run --rm -v "$PWD/api:/spec:ro" "$REDOCLY_IMAGE" lint /spec/openapi.yaml

      - name: sqlc diff (generated code matches the SQL)
        run: docker run --rm -v "$PWD:/src" -w /src "$SQLC_IMAGE" diff

      - name: Migrations up → down → up
        run: |
          migrate() {
            docker run --rm --network host -v "$PWD/db/migrations:/migrations" "$MIGRATE_IMAGE" \
              -path=/migrations -database "$TEST_DATABASE_URL" "$@"
          }
          migrate up
          migrate down -all
          migrate up
          migrate version

      - name: Unit tests
        run: go test -count=1 ./...

      # -p 1: packages share the one test database (same as make test-integration).
      - name: Integration tests
        run: go test -tags=integration -count=1 -p 1 ./...

      - name: govulncheck (non-blocking)
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Build (tsc -b + vite build)
        run: npm run build

      - name: npm audit (non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev

  # The production images build, and nginx accepts its config (Phase 7e).
  # Nothing is pushed anywhere.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build production images
        run: |
          cp .env.prod.example .env.prod
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-build-only/" .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod build

      - name: nginx -t
        run: docker run --rm --add-host api:127.0.0.1 goframework-prod-web nginx -t

  e2e:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Compose needs a .env; a throw-away password that lives only in this run.
      - name: Write .env
        run: |
          cp .env.example .env
          pw=$(node -e "process.stdout.write(require('crypto').randomBytes(18).toString('hex'))")
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$pw/" .env

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      # Drop + migrate + seed marketplace_e2e, create the E2E admin, start api-e2e.
      - name: E2E stack
        run: make e2e-reset e2e-up

      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # CI=true (set by Actions): Playwright's Chromium, forbidOnly, 1 retry.
      - name: Playwright
        working-directory: frontend
        run: npm run e2e

      - name: api-e2e logs
        if: failure()
        run: docker compose --profile e2e logs api-e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
