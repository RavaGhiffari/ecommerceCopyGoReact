
name: goframework

services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}

    # Loopback only: reachable from this machine, not from the local network.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8081
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SESSION_TTL: ${SESSION_TTL:-24h}
      DATABASE_URL: "postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_dev}?sslmode=disable"

    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:8081"

  # One-off tool, not a long-running service. Run it with
  #   docker compose run --rm migrate up      (or: make migrate-up)
  # The "tools" profile keeps it out of a plain `docker compose up`.
  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketplace_dev}?sslmode=disable

  # Same migrations, applied to the separate test database that integration
  # tests write to (and wipe). Keeps marketplace_dev untouched by tests.
  #   make test-db
  migrate-test:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/marketplace_test?sslmode=disable

  # ---- Browser E2E stack (Phase 7a) ------------------------------------------
  # A second API on its own database, marketplace_e2e, which `make e2e` drops,
  # migrates and seeds before every run. The dev database never sees E2E data.
  #   make e2e          (or: make e2e-reset && make e2e-up, then npm run e2e)
  api-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["e2e"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 8081
      LOG_LEVEL: warn
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5191
      SESSION_TTL: 24h
      # Every browser test signs up from the same IP (the Docker gateway), so
      # the production limits (10 sign-ups / hour) would stop the suite after
      # a few specs. Only this container raises them; the limiter itself is
      # covered by integration tests.
      RATE_LIMIT_REGISTRATIONS: 10000
      RATE_LIMIT_LOGIN_FAILURES: 1000
      DATABASE_URL: "postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/marketplace_e2e?sslmode=disable"
    ports:
      - "127.0.0.1:${API_E2E_HOST_PORT:-8082}:8081"

  migrate-e2e:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/db/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD}@postgres:5432/marketplace_e2e?sslmode=disable

volumes:
  pgdata:
    driver: local
