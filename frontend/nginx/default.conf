# Production web server (Phase 7e): serves the built SPA and forwards the API.
#
# One origin for the browser. The page and /api/* come from the same
# scheme://host:port, so the session cookie is first-party, no CORS is
# involved, and the API's CSRF check (Origin must equal Host) holds.
# Vite's dev proxy plays this role in development (vite.config.ts).
#
# TLS is NOT handled here. Put an HTTPS terminator in front (or add a 443
# server block with certificates). The session cookie is Secure in
# production, so a browser only sends it over HTTPS (http://localhost is the
# one exception browsers make). HSTS belongs on that HTTPS listener.

# The API service on the compose network. Resolved once at start-up.
upstream api {
    server api:8081;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;            # no nginx version in headers or error pages

    root /usr/share/nginx/html;

    # The API refuses bodies over 1 MiB itself (413 in its own envelope);
    # this only has to be a little larger so that answer can come through.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- API ---------------------------------------------------------------
    # The Go API sends its own security headers; nothing is added here.
    location /api/ {
        proxy_pass http://api;
        # Keep the browser's Host (with port). The API compares it with the
        # Origin header; rewriting it would make every POST look cross-site.
        proxy_set_header Host              $http_host;
        # REPLACE (not append) the header with the address nginx saw. nginx
        # is the edge, so anything a client wrote there is a forgery; the
        # API trusts this header only from nginx (TRUSTED_PROXIES).
        # If a TLS terminator / load balancer is put in front, $remote_addr
        # becomes that box: then configure ngx_http_realip_module
        # (set_real_ip_from <its IP>; real_ip_header X-Forwarded-For;) so
        # $remote_addr is the client again. See docs/DEPLOY.md.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_read_timeout 30s;
    }

    location = /health { proxy_pass http://api; }
    location = /ready  { proxy_pass http://api; }

    # ---- SPA ---------------------------------------------------------------
    # Vite gives every built file a content hash in its name, so a file under
    # /assets/ never changes: cache it for a year. A missing asset is a real
    # 404 (never index.html, which would be parsed as JavaScript).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Any other path is a client-side route: serve index.html, and never
    # cache it, so a new deploy is picked up on the next load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
