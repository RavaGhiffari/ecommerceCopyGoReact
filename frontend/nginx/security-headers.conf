# Security headers for the SPA (index.html and /assets). Included per
# location because an add_header inside a location replaces every add_header
# inherited from the server block.
#
# Content-Security-Policy, directive by directive:
#   default-src 'self'          anything not listed below: this origin only
#   script-src 'self'           only our bundled files; the build has no inline
#                               script, so an injected <script> cannot run
#   style-src 'self' 'unsafe-inline'
#                               our CSS file, plus inline style attributes
#                               (React style={…}, Radix popover positioning)
#   img-src 'self' data: https: http:
#                               product images are seller-provided URLs on any
#                               host (PROJECT_STATE §9: no upload yet)
#   connect-src 'self'          fetch() only to our own /api
#   object-src 'none'; base-uri 'self'; form-action 'self'
#   frame-ancestors 'none'      nobody may frame the app (clickjacking)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
